<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="description" content="Açık kaynak, ücretsiz İngilizce kelime kartı uygulaması" />
    <!-- Gövde fontu (latin + Türkçe karakterler için latin-ext) ve başlık fontu: CSS beklenmeden insin -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-ext-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/fraunces-latin-opsz-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Kelime</title>
    <script>
      // Sayfa çizilmeden temayı uygula (beyaz parlama olmasın); ayrıntı: src/lib/theme.ts
      try {
        var t = localStorage.getItem('kelime-theme') || 'system'
        var dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <style>
      /* Açılış ekranı: JS inmeden görünür, React ilk çizimde yerine geçer */
      html {
        background: #faf7f2;
      }
      html.dark {
        background: #0b0b10;
      }
      .splash {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        animation: splash-in 0.4s ease-out both;
      }
      .splash svg {
        width: 72px;
        height: 72px;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Kelime yükleniyor">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect
            x="10"
            y="5"
            width="15"
            height="20"
            rx="3"
            fill="#a855f7"
            transform="rotate(12 17.5 15)"
          />
          <rect
            x="7"
            y="7"
            width="15"
            height="20"
            rx="3"
            fill="#f59e0b"
            transform="rotate(-6 14.5 17)"
          />
          <g transform="rotate(-6 14.5 17)" fill="#18181b">
            <rect x="9.5" y="12" width="8" height="2" rx="1" />
            <rect x="9.5" y="16" width="10" height="1.2" rx=".6" opacity=".55" />
            <rect x="9.5" y="22" width="5" height="2" rx="1" fill="#22c55e" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
